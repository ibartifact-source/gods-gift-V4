                { title: "カスタム飲料", code: "CF-001", color: "#00f0ff", rgb: "0, 240, 255", subtitle: "飲料をカスタムしますか？", desc: "調合シミュレーションを體驗：\n📌 成分を選択・入力\n📄 最終的なカロリーを表示", btn: "開始する▶️", url: "https://timely-duckanoo-ee35d4.netlify.app/" },
                { title: "神のセット", code: "GM-002", color: "#d4af37", rgb: "212, 175, 55", subtitle: "現在のセットプラン", desc: "新しい食事モードを開始。ランチから始めてミッションをクリアし、健康な生活を築きましょう。", btn: "開始する！👉", url: "https://ibartifact-source.github.io/gods-meal/" },
                { title: "終身半額枠", code: "LF-003", color: "#ff00ff", rgb: "255, 0, 255", subtitle: "終身半額資格の取得", desc: "枠數限定：\n📌 毎月の配送箱數を選択\n👨 6ヶ月継続で資格獲得", btn: "詳細を見る", url: "https://lighthearted-pegasus-4c316a.netlify.app/" },
                { title: "サービス時間", code: "SH-004", color: "#00ff9f", rgb: "0, 255, 159", subtitle: "（月〜金）", desc: "時間帯：\n🔔 9:00-10:00：オンライン注文\n👨 15:00-17:00：對人サポート", btn: "24H AIアシスト", url: "https://chatbot-vuyupo7x.manus.space/" },
                { title: "よくある質問", code: "QA-005", color: "#ffff00", rgb: "255, 255, 0", subtitle: "プロジェクトを深く知る", desc: "リソースセンターにガイドを用意しました。", btn: "質問を見る", url: "https://faqweb-hq8a4kf5.manus.space/" },
                { title: "持続的な修行", code: "SP-006", color: "#ff8c00", rgb: "255, 140, 0", subtitle: "完璧を練り上げる", desc: "エネルギー信号、必然的習慣などの手法。ログを完了し、善の魔力を獲得しましょう。", btn: "❤️修行開始", url: "https://cerulean-chebakia-96c566.netlify.app/" }
            ]
        };

        const AdvertisementWall = () => {
            const videoRef = useRef(null);
            useEffect(() => { if (videoRef.current) videoRef.current.play().catch(e => {}); }, []);
            return (
                <div className="relative w-full h-full overflow-hidden bg-black flex flex-col group transition-all duration-700">
                    <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover opacity-80 z-10" src="video.mp4" autoPlay loop muted playsInline />
                    <div className="absolute inset-0 z-0"><div className="w-full h-full bg-[#d4af37]/5 mix-blend-color-dodge"></div></div>
                    <div className="grain absolute inset-0 z-20"></div>
                    <div className="scan-line z-30"></div>
                    <div className="absolute top-4 left-4 w-4 h-4 border-t-2 border-l-2 border-[#d4af37]/40 z-40"></div>
                    <div className="absolute top-4 right-4 w-4 h-4 border-t-2 border-r-2 border-[#d4af37]/40 z-40"></div>
                    <div className="absolute bottom-4 left-4 w-4 h-4 border-b-2 border-l-2 border-[#d4af37]/40 z-40"></div>
                    <div className="absolute bottom-4 right-4 w-4 h-4 border-b-2 border-r-2 border-[#d4af37]/40 z-40"></div>
                </div>
            );
        };

        function App() {
            const [page, setPage] = useState('gateway');
            const [isLoaded, setIsLoaded] = useState(false);
            const [lang, setLang] = useState('zh');
            const [showLangMenu, setShowLangMenu] = useState(false);
            const [regionIdx, setRegionIdx] = useState(0);

            const [globalStats, setGlobalStats] = useState([
                { name: { zh: '載入中...', en: 'Loading...', jp: '読み込み中...' }, release: 0, remaining: 0 }
            ]);

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch(`data.json?v=${Date.now()}`);
                        if (!response.ok) throw new Error('Network response was not ok');
                        const data = await response.json();
                        setGlobalStats(data);
                    } catch (error) {
                        setGlobalStats([ 
                            { name: { zh: '台灣', en: 'Taiwan', jp: '台灣' }, release: 500, remaining: 42 }, 
                            { name: { zh: '日本', en: 'Japan', jp: '日本' }, release: 800, remaining: 126 }, 
                            { name: { zh: '美國', en: 'USA', jp: 'USA' }, release: 1200, remaining: 345 }, 
                            { name: { zh: '韓國', en: 'Korea', jp: '韓國' }, release: 600, remaining: 0 } 
                        ]);
                    }
                };
                fetchData();
            }, []);

            useEffect(() => { setIsLoaded(true); }, [page]);
            const enterSystem = () => { setIsLoaded(false); setTimeout(() => setPage('system'), 800); };

            const LanguageSwitcher = ({ isFloating }) => (
                <div className={isFloating ? "fixed top-6 right-6 z-[100]" : "relative"}>
                    <button onClick={() => setShowLangMenu(!showLangMenu)} className="flex items-center gap-3 px-4 py-2 border border-[#d4af37]/40 bg-black/60 backdrop-blur-md hover:bg-[#d4af37] hover:text-black transition-all">
                        <IconGlobe className="w-4 h-4" />
                        <span className="text-[12px] font-bold tracking-widest uppercase">{i18n[lang].name}</span>
                    </button>
                    {showLangMenu && (
                        <div className="absolute top-full right-0 mt-2 bg-black/90 border border-[#d4af37]/20 flex flex-col min-w-[120px] shadow-2xl z-[110]">
                            {Object.keys(i18n).map(k => (
                                <button key={k} onClick={() => { setLang(k); setShowLangMenu(false); }} className={`px-4 py-2 text-[12px] text-left hover:bg-[#d4af37]/20 ${lang === k ? 'text-[#d4af37] bg-[#d4af37]/10' : ''}`}>
                                    {i18n[k].name}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );

            return (
                <div className="min-h-screen bg-[#0d0d08] text-[#f5d76e] relative overflow-x-hidden" style={{ fontFamily: "'Share Tech Mono', monospace" }}>
                    <div className="magazine-bg-text">PEPTIDE</div>
                    <div className="fixed inset-0 grid-bg pointer-events-none z-[1]"></div>

                    {page === 'gateway' && <LanguageSwitcher isFloating={true} />}

                    {page === 'gateway' && (
                        <div className={`relative z-10 flex flex-col items-center justify-start md:justify-center min-h-screen px-4 pt-12 md:pt-0 transition-all duration-[1s] ${isLoaded ? 'opacity-100' : 'opacity-0'}`} style={{ fontFamily: "'Noto Serif TC', serif" }}>
                            <div className="relative w-full max-w-[500px] flex flex-col items-center">
                                <div className="relative w-full flex items-center justify-center scale-[0.8] md:scale-100 mb-4 md:mb-10">
                                    <div className="relative w-60 h-60 md:w-72 md:h-72 border border-[#d4af37]/30 bg-[#141410]/60 backdrop-blur-3xl overflow-hidden shadow-[0_0_60px_rgba(0,0,0,0.8)] z-10">
                                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                                            <div className="relative w-36 h-36 md:w-48 md:h-48">
                                                <div className="absolute inset-0 border-[0.5px] border-[#d4af37]/20 rotate-45 animate-spin-slow" />
                                                <div className="absolute inset-3 border-[0.5px] border-[#d4af37]/40 -rotate-45 animate-spin-slow-reverse" />
                                                <div className="absolute inset-6 border-2 border-[#d4af37] animate-pulse" />
                                                <div className="absolute inset-0 flex items-center justify-center"><IconCpu className="text-[#d4af37] w-8 h-8 md:w-12 md:h-12" /></div>
                                            </div>
                                            <div className="mt-6 text-center px-4">
                                                <div className="text-[12px] font-black tracking-[0.4em] mb-2 opacity-50 uppercase">Heaven Operating System</div>
                                                <div className="flex gap-1 justify-center">
                                                    {[...Array(12)].map((_, i) => (
                                                        <div key={i} className="w-0.5 md:w-1 h-2 bg-[#d4af37]/30 animate-pulse" style={{ animationDelay: `${i*0.1}s` }} />
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="absolute w-[110%] h-[110%] border-[0.5px] border-[#d4af37]/10 rotate-[15deg] animate-spin-slow opacity-30" />
                                </div>
                                <div className="relative w-full flex flex-col items-center">
                                    <div className="relative flex flex-col items-center w-64 md:w-96 mb-6">
                                        <div className="w-full h-2 bg-[#d4af37] shadow-[0_0_20px_#d4af37] relative z-20">
                                            <div className="absolute -left-1 -top-1 w-3 h-3 bg-[#d4af37] rotate-45"></div>
                                            <div className="absolute -right-1 -top-1 w-3 h-3 bg-[#d4af37] rotate-45"></div>
                                        </div>
                                        <div className="w-[80%] h-1 bg-[#d4af37] shadow-[0_0_15px_#d4af37] mt-3 relative z-10"></div>
                                        <div className="absolute top-0 left-[10%] w-1 md:w-1.5 h-32 md:h-48 bg-gradient-to-b from-[#d4af37] to-transparent opacity-60 shadow-[0_0_15px_#d4af37] z-0"></div>
                                        <div className="absolute top-0 right-[10%] w-1 md:w-1.5 h-32 md:h-48 bg-gradient-to-b from-[#d4af37] to-transparent opacity-60 shadow-[0_0_15px_#d4af37] z-0"></div>
                                    </div>
                                    <div className="py-6 md:py-8 text-center relative z-[30]">
                                        <div className="flex items-center justify-center gap-3 mb-4 md:mb-5">
                                            <IconSettings className="animate-spin-slow text-[#d4af37] w-3 h-3 md:w-4 md:h-4" />
                                            <div className="text-[12px] md:text-[14px] font-bold tracking-[1em] text-[#d4af37] uppercase opacity-80">PEPTIDE Technology</div>
                                        </div>
                                        <h1 className="text-4xl md:text-7xl font-black uppercase italic flex flex-col gap-0">
                                            <span className="block tracking-tighter mb-1 md:mb-2">{i18n[lang].title}</span>
                                            <span className="relative inline-block not-italic shiny-text leading-none">{i18n[lang].subtitle}</span>
                                        </h1>
                                    </div>
                                    <button onClick={enterSystem} className="group relative px-12 md:px-24 py-6 md:py-7 overflow-hidden bg-[#d4af37]/5 border border-[#d4af37]/40 text-[#d4af37] font-bold text-[18px] md:text-[22px] tracking-[0.5em] transition-all hover:bg-[#d4af37] hover:text-black">
                                        <span className="relative z-10 flex items-center gap-4">{i18n[lang].start} <IconChevronRight className="group-hover:translate-x-2 transition-transform w-4 h-4" /></span>
                                        <div className="absolute top-0 -left-[100%] w-full h-full bg-gradient-to-r from-transparent via-white/40 to-transparent group-hover:left-[100%] transition-all duration-700" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {page === 'system' && (
                        <div className={`relative z-10 transition-all duration-[1s] ${isLoaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                            <header className="border-b border-[#d4af37]/20 bg-black/40 backdrop-blur-md sticky top-0 z-50">
                                <div className="max-w-[1400px] mx-auto px-6 h-16 flex items-center justify-between">
                                    <div className="breathing-text-container">
                                        <div className="breathing-text" data-text={i18n[lang].status}>{i18n[lang].status}</div>
                                    </div>
                                    <LanguageSwitcher isFloating={false} />
                                </div>
                            </header>

                            <main className="max-w-[1400px] mx-auto px-6 py-12 space-y-20">
                                <section className="grid lg:grid-cols-2 gap-12 items-center">
                                    <div className="space-y-8">
                                        <div className="sync-tag-box inline-block"><span className="sync-tag-label">{i18n[lang].tag}</span></div>
                                        <h2 className="text-6xl md:text-8xl font-black italic uppercase leading-none shiny-text" style={{ fontFamily: "'Noto Serif TC', serif" }}>{i18n[lang].hero}</h2>
                                        <p className="text-[20px] md:text-[24px] opacity-90 leading-[1.7] max-w-2xl" style={{ fontFamily: "'Noto Serif TC', serif" }}>{i18n[lang].hero_desc}</p>
                                        
                                        <div className="space-y-4 pt-10 border-t border-[#d4af37]/20">
                                            <div className="sync-tag-box inline-block"><span className="sync-tag-label" style={{ fontSize: '16px', letterSpacing: '0.2em' }}>{i18n[lang].stats_title}</span></div>
                                            <div className="grid grid-cols-3 gap-4 max-w-md pt-4">
                                                <div className="space-y-1 cursor-pointer hover:bg-white/5 p-2 rounded transition-colors" onClick={() => setRegionIdx((prev) => (prev + 1) % globalStats.length)}>
                                                    <div className="text-[16px] text-[#d4af37] font-bold uppercase tracking-wider flex items-center whitespace-nowrap">{i18n[lang].region}</div>
                                                    <div className="text-xl font-bold truncate text-white">{globalStats[regionIdx]?.name[lang]}</div>
                                                </div>
                                                <div className="space-y-1 border-l border-[#d4af37]/20 pl-4">
                                                    <div className="text-[16px] text-[#d4af37] font-bold uppercase tracking-wider">{i18n[lang].release}</div>
                                                    <div className="text-2xl font-black italic text-white"><RollingNumber key={`rel-${regionIdx}`} value={globalStats[regionIdx]?.release || 0} /></div>
                                                </div>
                                                <div className="space-y-1 border-l border-[#d4af37]/20 pl-4">
                                                    <div className="text-[16px] text-[#00d4ff] font-bold uppercase tracking-wider">{i18n[lang].remaining}</div>
                                                    <div className="text-2xl font-black italic text-[#00d4ff] shadow-[0_0_10px_rgba(0,212,255,0.5)]"><RollingNumber key={`rem-${regionIdx}`} value={globalStats[regionIdx]?.remaining || 0} /></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="relative aspect-video bg-black border border-[#d4af37]/30 cyber-border overflow-hidden"><AdvertisementWall /></div>
                                </section>

                                <section className="grid md:grid-cols-3 gap-6">
                                    {cards_i18n[lang].map((item, i) => (
                                        <div key={i} className="p-8 border border-[#d4af37]/40 bg-[#141410]/40 backdrop-blur-xl relative group hover:border-[#d4af37] hover:shadow-[0_0_25px_rgba(212,175,55,0.4)] transition-all duration-500 overflow-hidden">
                                            {[IconSettings, IconZap, IconCpu][i] && React.createElement([IconSettings, IconZap, IconCpu][i], { className: "w-10 h-10 mb-6 text-[#d4af37] animate-spin-slow" })}
                                            <h3 className="text-2xl md:text-3xl font-bold mb-2 text-white" style={{ fontFamily: "'Noto Serif TC', serif" }}>{item.title}</h3>
                                            <div className="text-[#f5d76e] text-[20px] md:text-[24px] font-[900] tracking-widest mb-4 uppercase">{item.subtitle}</div>
                                            <p className="text-[20px] md:text-[22px] opacity-80 leading-[1.6]" style={{ fontFamily: "'Noto Serif TC', serif" }}>{item.desc}</p>
                                        </div>
                                    ))}
                                </section>

                                <section className="pt-20 border-t border-[#d4af37]/10">
                                    <div className="text-center mb-12"><h3 className="text-4xl md:text-5xl font-black uppercase italic" style={{ fontFamily: "'Noto Serif TC', serif" }}>{i18n[lang].explore_title}</h3></div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                                        {explore_i18n[lang].map((card, i) => (
                                            <div key={i} className="cyber-card group" style={{ '--neon-color': card.color, '--neon-rgb': card.rgb }}>
                                                <div className="p-8 flex flex-col h-full relative z-10">
                                                    <div className="flex justify-between items-start mb-10"><div className="text-[12px] font-mono py-1 px-2 bg-white/5 text-white/40 border border-white/5">{card.code}</div><div className="status-light" style={{ '--neon-color': card.color }}></div></div>
                                                    <h4 className="text-2xl md:text-3xl font-black mb-3 text-white" style={{ fontFamily: "'Noto Serif TC', serif" }}>{card.title}</h4>
                                                    <div className="text-[20px] md:text-[24px] font-black tracking-widest mb-6 italic opacity-90" style={{ color: card.color, fontFamily: "'Orbitron', sans-serif" }}>{card.subtitle}</div>
                                                    <p className="text-[20px] md:text-[22px] text-white/60 leading-[1.6] mb-12 min-h-[140px] whitespace-pre-line" style={{ fontFamily: "'Noto Serif TC', serif" }}>{card.desc}</p>
                                                    <a href={card.url} target="_blank" rel="noopener noreferrer" className="mt-auto py-4 px-6 border border-[var(--neon-color)] text-[var(--neon-color)] font-bold tracking-widest uppercase hover:bg-[var(--neon-color)] hover:text-black transition-all text-center">
                                                        {card.btn}
                                                    </a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                {/* 支付區塊：已整合中文連結 */}
                                <PaymentSection lang={lang} />

                                <footer className="pt-32 pb-12 text-center space-y-12">
                                    <div className="text-[#d4af37] text-3xl md:text-5xl font-black italic" style={{ fontFamily: "'Noto Serif TC', serif" }}>
                                        {i18n[lang].quote}
                                    </div>
                                    <div className="text-[14px] tracking-widest opacity-30 uppercase">
                                        @ 2026 {i18n[lang].copyrightText}
                                    </div>
                                </footer>
                            </main>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
